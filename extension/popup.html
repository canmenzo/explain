<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Explain</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main data-state="checking">
      <header>
        <span class="mark" aria-hidden="true">e</span>
        <div>
          <h1>Explain</h1>
          <p>A little clarity as you read.</p>
        </div>
      </header>
      <section id="ready" class="panel ready" aria-labelledby="ready-title" hidden>
        <div class="ready-head">
          <span class="check" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4.5 8.25 2.25 2.25 4.75-5"/></svg></span>
          <div>
            <h2 id="ready-title">Ready to explain</h2>
            <p>Your key is saved.</p>
          </div>
        </div>
        <button id="replace" class="replace" type="button" aria-controls="key-form" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>Replace key</button>
      </section>
      <form id="key-form" class="panel" novalidate hidden>
        <div class="label-row">
          <label for="api-key">Gemini API key</label>
          <a class="help" href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Get a free key<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5h6v6M11.25 4.75 4.5 11.5"/></svg></a>
        </div>
        <div class="key-input">
          <input id="api-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" required aria-describedby="key-error">
          <button id="toggle-key" type="button" aria-label="Show API key" aria-controls="api-key" aria-pressed="false">
            <svg class="eye" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 8S4 3.75 8 3.75 14.25 8 14.25 8 12 12.25 8 12.25 1.75 8 1.75 8Z"/><circle cx="8" cy="8" r="1.9"/></svg>
            <svg class="eye-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 4a6.6 6.6 0 0 1 1.6-.25C12 3.75 14.25 8 14.25 8a11 11 0 0 1-1.6 2.1M4.2 5.1A10.6 10.6 0 0 0 1.75 8S4 12.25 8 12.25a6.2 6.2 0 0 0 3.1-.85M6.65 6.65a1.9 1.9 0 0 0 2.7 2.7M2.5 2.5l11 11"/></svg>
          </button>
        </div>
        <p id="key-error" class="field-error" hidden></p>
        <div class="actions">
          <button id="cancel" class="secondary" type="button" hidden>Cancel</button>
          <button class="save" type="submit"><span class="spinner" aria-hidden="true"></span><span class="save-label">Save key</span></button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
